<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Wael Shalak">

<!-- Movement Planner v1.1 — designed and built by Wael Shalak, October 2026. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syria Movement Planner</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:var(--color-bg); --surface:var(--color-bg); --surface-2:var(--color-surface); --ink:var(--color-text); --muted:var(--color-neutral-700); --line:var(--color-divider);
  --accent:var(--color-accent-600); --accent-ink:var(--color-accent-700); --accent-soft:var(--color-accent-100); --on-accent:var(--color-bg);
  --seat:var(--color-accent-2-700); --seat-soft:var(--color-accent-2-100); --ok:var(--color-accent-800); --bad:var(--color-neutral-400); --warn:var(--color-text); --idle:var(--color-neutral-500);
  --arc-seat:var(--color-accent-2-500); --arc-plan:var(--color-accent-400); --arc-done:var(--color-neutral-400);
  --sea:var(--color-accent-100); --land:var(--color-neutral-200); --syria:var(--color-bg); --border-c:var(--color-neutral-400);
  --f-display:"Barlow Condensed","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Barlow","IBM Plex Sans Arabic",system-ui,sans-serif;
  --tint:color-mix(in srgb,var(--color-text) 5%,transparent);
  --nav-h:62px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 20px 40px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent-ink)} a:hover{color:var(--color-accent-800)}
.mono,.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.wrap{max-width:1440px;margin-inline:auto}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:14px 0 12px;position:sticky;top:0;z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;background:var(--color-accent);display:grid;place-items:center;flex:none;border:0!important}
.brand-mark svg{display:block}
.brand h1{font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:3px 3px 3px 12px;min-height:40px}
[dir="rtl"] .who{padding:3px 12px 3px 3px}
.who .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.who-id{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.who-name{font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-mail{font-size:11px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.role{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:var(--accent-soft);color:var(--color-accent-800);padding:2px 8px}
.lang{display:flex;border:1px solid var(--line)}
.lang button{border:0;background:none;padding:0 14px;min-height:38px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted)}
.lang button+button{border-inline-start:1px solid var(--line)}
.lang button:hover{background:var(--tint)}
.lang button[aria-pressed="true"]{background:var(--color-text);color:var(--bg)}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login{width:min(460px,100%);padding:28px;display:flex;flex-direction:column;gap:16px}
.login h1{font-size:24px}
.login h2{font-size:28px!important;text-transform:uppercase}
.login .lede{color:var(--muted);margin:0}
.demo{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sample{font-family:var(--f-display);font-size:11px;font-weight:600;color:var(--color-accent-800);border:1px solid var(--color-accent-400);padding:0 6px;text-transform:uppercase;letter-spacing:.08em}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;align-items:stretch;position:sticky;top:66px;z-index:9;background:var(--bg)}
.tab{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:8px;position:relative}
.tab:hover{color:var(--ink);background:var(--tint)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--color-accent)}
.badge{min-width:20px;height:20px;padding:0 6px;background:var(--color-accent-2-600);color:var(--bg);font-family:var(--f-body);font-size:12px;font-weight:500;display:inline-grid;place-items:center;letter-spacing:0}
.tab-actions{margin-inline-start:auto;display:flex;gap:10px;align-items:center;padding:6px 0}
.fab{display:none}
.credit{margin-top:40px;padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.06em;color:var(--color-neutral-500)}
.viewsw{display:flex;border:1px solid var(--line)}
.viewsw button{border:0;background:none;padding:0 12px;min-height:30px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.viewsw button+button{border-inline-start:1px solid var(--line)}
.viewsw button:hover{background:var(--tint)}
.viewsw button[aria-pressed="true"]{background:var(--color-text);color:var(--bg)}
@media (min-width:520px){
  html.v-phone{background:var(--color-neutral-200)}
  html.v-phone body{max-width:430px;margin-inline:auto;min-height:100vh;box-shadow:var(--shadow-lg);background:var(--bg)}
  html.v-phone .tabs,html.v-phone .fab,html.v-phone .notify{left:calc(50% - 215px + 8px)!important;right:calc(50% - 215px + 8px)!important;inset-inline:auto}
  html.v-phone .tabs{left:calc(50% - 215px)!important;right:calc(50% - 215px)!important}
  html.v-phone .overlay{justify-content:center}
  html.v-phone .sheet{width:430px}
}
.map-svg .truck{pointer-events:none;transition:opacity .5s}
.map-svg .truck path,.map-svg .truck circle{fill:var(--bg);stroke:var(--color-accent-900);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{min-height:40px;font-size:15px;white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 14px}
.btn:hover{background:var(--tint)}
.btn:active{background:color-mix(in srgb,var(--color-text) 12%,transparent)}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--bg)}
.btn.primary:hover{background:var(--color-accent-600)}
.btn.primary:active{background:var(--color-accent-700)}
.btn.seat{background:var(--color-accent-2-600);border-color:var(--color-accent-2-600);color:var(--bg);min-height:46px;font-size:16px}
.btn.seat:hover{background:var(--color-accent-2-700)}
.btn.ghost{border-color:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn.small{min-height:32px;padding:3px 10px;font-size:14px}
.btn.danger{color:var(--color-neutral-800);text-decoration:underline;text-decoration-color:var(--color-neutral-400);text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .i{width:17px;height:17px}

/* chips & pills */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:0 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--color-accent-700);color:var(--bg);border-color:var(--color-accent-700)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.st-planned,.st-accepted{background:var(--color-accent-100);color:var(--color-accent-800)}
.st-completed,.st-covered{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.st-cancelled,.st-declined,.st-withdrawn{border-color:var(--line);color:var(--color-neutral-600)}
.st-overdue{background:var(--color-accent-900);color:var(--bg)}
.st-unknown{background:var(--color-neutral-100);color:var(--color-neutral-700);border-color:var(--line)}
.st-pending,.st-open{background:var(--color-accent-2-100);border-color:var(--color-accent-2-400);color:var(--color-accent-2-800)}
.ag{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.05em;padding:0 6px;border:1px solid var(--line);white-space:nowrap;line-height:20px;display:inline-block}
.ag.me{background:var(--color-text);color:var(--bg);border-color:var(--color-text)}

/* steps strip */
.hint{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.hint li{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--muted);font-size:14px}
.hint li+li{border-inline-start:1px solid var(--line)}
.hint b{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--color-accent-2-600)}

/* map tab */
.map-bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.map-bar select,.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--color-surface);border-radius:0;padding:6px 10px;min-height:38px;min-width:0}
.map-bar select:hover,.filters input:hover,.filters select:hover,.field input:hover,.field select:hover,.field textarea:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.map-bar select:focus-visible,.filters input:focus-visible,.filters select:focus-visible,.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{border-color:var(--color-accent);outline-offset:0}
input[type="checkbox"]{accent-color:var(--color-accent-700);width:18px;height:18px;margin:0}
.mview{display:none}
.map-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:20px;align-items:start}
.panel{background:transparent;border:1px solid var(--line);min-width:0}
.map-panel{position:relative}
.map-svg{display:block;width:100%;height:auto;background:var(--sea);direction:ltr}
.map-svg .c-other{fill:var(--land);stroke:var(--border-c);stroke-width:.6}
.map-svg .c-syr{fill:var(--syria);stroke:var(--ink);stroke-width:1.2;stroke-opacity:.55}
.map-svg .cname{font-family:var(--f-display);font-size:14px;fill:var(--color-neutral-600);letter-spacing:.2em;text-transform:uppercase;pointer-events:none}
.map-svg .arc{fill:none;stroke-linecap:butt;cursor:pointer;transition:opacity .15s}
.map-svg .arc.dim{opacity:.15}
.map-svg .arc-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.map-svg .city circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.6;cursor:pointer}
.map-svg .city.hub circle{fill:var(--ink)}
.map-svg .city.sel circle{fill:var(--color-accent);stroke:var(--color-accent-800)}
.map-svg .city text{font-family:var(--f-body);font-size:13px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--syria);stroke-width:3.5px;stroke-linejoin:round;cursor:pointer}
.map-svg .city text.sub{font-size:10px;font-weight:400;fill:var(--muted)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:20px;height:4px;display:inline-block}
.map-note{position:absolute;inset-inline-start:12px;top:12px;background:var(--bg);border:1px solid var(--line);padding:4px 4px 4px 12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-md)}

.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-head h2{font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.list-head .sub{color:var(--muted);font-size:13px}
.trip-list{max-height:680px;overflow:auto}
.trip{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);cursor:pointer;align-items:center}
.trip:last-child{border-bottom:0}
.trip:hover{background:var(--tint)}
.trip .d{text-align:center;line-height:1;border-inline-end:1px solid var(--line);padding-inline-end:10px}
.trip .d b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600}
.trip .d small{font-family:var(--f-display);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.trip .route{font-weight:500;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trip .meta{color:var(--muted);font-size:13px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.trip .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.seatbar{display:inline-flex;gap:2px;vertical-align:middle}
.seatbar i{width:7px;height:12px;background:var(--ink)}
.seatbar i.free{background:none;border:1.5px solid var(--seat)}
.arrow{color:var(--muted)}
[dir="rtl"] .arrow{display:inline-block;transform:scaleX(-1)}
.empty{padding:32px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.alert{border:1px solid var(--line);padding:10px 12px;background:var(--color-neutral-100);font-size:14px}
.alert.warn{border-color:var(--color-neutral-500)}
.alert.seat{background:var(--color-accent-2-100);border-color:var(--color-accent-2-300)}

/* register */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.filters input[type="search"]{flex:1 1 220px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:start;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--tint)}
td.wrapcell{white-space:normal;max-width:280px;color:var(--muted);font-size:13px}
.more{padding:12px;text-align:center}

/* requests */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.card-row{padding:14px 16px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);display:flex;flex-direction:column;gap:8px}
.card-row:last-of-type{border-bottom:0}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* agencies */
.ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.ag-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.ag-card h3{font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact{display:grid;gap:2px;font-size:14px;padding-top:10px;border-top:1px dashed var(--line)}
.contact b{font-weight:500}
.contact .k{font-family:var(--f-display);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.copy{border:0;background:none;padding:4px 6px;cursor:pointer;color:var(--accent-ink);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.areas{display:flex;gap:4px;flex-wrap:wrap}
.area{font-size:12px;padding:1px 7px;background:var(--color-accent-100);color:var(--color-accent-800)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.kpi{padding:16px}
.kpi .v{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:6px}
.kpi.alertk .v{color:var(--color-accent-2-700)}
.chart{padding:16px}
.chart h3{font-size:18px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.02em}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .track{height:14px;background:var(--color-neutral-200);display:flex}
.hbar .fill{height:100%;background:var(--color-accent-600)}
.hbar .fill.b{background:var(--color-accent-2-300)}
.hbar .n{text-align:end}
.months{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:6px;border-bottom:1px solid var(--line)}
.mcol{flex:1;display:flex;flex-direction:column-reverse;min-width:0;height:100%}
.mcol .seg{display:block;width:100%;border:0;overflow:visible}
.mcol .seg.c{background:var(--color-accent-800)}
.mcol .seg.p{background:var(--color-accent-300)}
.mcol .seg.x{background:var(--color-neutral-400)}
.mlabels{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:4px}
.mlabels span{flex:1;text-align:center;min-width:0;overflow:hidden}
.mini-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.mini-legend i{display:inline-block;width:10px;height:10px;margin-inline-end:5px;vertical-align:-1px}

/* notifications */
.bell{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:none;cursor:pointer;color:var(--ink)}
.bell:hover{background:var(--tint)}
.bell .i{width:20px;height:20px}
.bell .badge{position:absolute;top:-7px;inset-inline-end:-7px}
#notify-root{position:relative;z-index:35}
.notify{position:fixed;inset-inline-end:20px;bottom:20px;width:min(440px,calc(100vw - 40px));max-height:min(640px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:nIn .28s ease-out}
@keyframes nIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.notify-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);border-top:4px solid var(--color-accent-2-500)}
.notify-head h2{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.notify-body{overflow:auto;flex:1}
.notify-g{font-family:var(--f-display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 16px 4px;display:flex;gap:6px}
.notify-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 16px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);align-items:start}
.notify-item .n-ic{width:28px;height:28px;display:grid;place-items:center;background:var(--color-accent-100);color:var(--color-accent-800)}
.notify-item.n-overdue .n-ic,.notify-item.n-reimb .n-ic{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.notify-item.n-req .n-ic,.notify-item.n-need .n-ic,.notify-item.n-myneed .n-ic{background:var(--color-accent);color:var(--bg)}
.notify-item .n-ic .i{width:16px;height:16px}
.n-txt{font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:3px}
.n-txt > .small{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.n-acts{grid-column:2}
.notify-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
@media (max-width:760px){
  .bell{width:40px;height:40px}

const K=100, CO=Math.cos(34.5*Math.PI/180);
const proj = (lat,lon)=>[(lon-34.3)*K*CO,(38-lat)*K];
function mapTrips(){
  const m=S.map; let arr=[...S.trips.values()];
  if(m.range==="upcoming") arr=arr.filter(x=>x.date>=TODAY && x.status!=="cancelled");
  else if(m.range==="week") arr=arr.filter(x=>x.date>=TODAY && x.date<=addDays(TODAY,7) && x.status!=="cancelled");
  else if(m.range==="past30") arr=arr.filter(x=>x.date<TODAY && x.date>=addDays(TODAY,-30));
  if(m.agency) arr=arr.filter(x=>x.lead===m.agency || (x.pax||[]).includes(m.agency));
  if(m.seatsOnly) arr=arr.filter(isOpenForSeats);
  return arr;
}

let truckQ=new Set(), truckT=null;
function queueTrucks(){
  const svg=$(".map-svg"); if(!svg||!svg.getBoundingClientRect().width) return;
  S.drawn=S.drawn||new Set();
  svg.querySelectorAll("g[data-route]").forEach(g=>{ const k=g.dataset.route; if(!S.drawn.has(k)){ S.drawn.add(k); truckQ.add(k); } });
  clearTimeout(truckT); truckT=setTimeout(runTrucks,350);
}
function runTrucks(){
  const svg=$(".map-svg"); const q=[...truckQ]; truckQ.clear();
  if(!svg||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  q.slice(0,8).forEach((k,i)=>{ const p=svg.querySelector(`g[data-route="${k}"] .arc`); if(p&&!p.classList.contains("dim")) setTimeout(()=>spawnTruck(svg,p),i*300); });
}
function spawnTruck(svg,path){
  if(!svg.isConnected) return;
  const NS="http://www.w3.org/2000/svg", g=document.createElementNS(NS,"g"); g.setAttribute("class","truck");
  g.innerHTML='<g transform="scale(1.15) translate(-12,-14)"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></g>';
  svg.appendChild(g);
  const L=path.getTotalLength(), dur=Math.min(3200,1400+L*4), t0=performance.now();
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  (function step(now){
    if(!g.isConnected) return;
    const u=Math.min(1,Math.max(0,(now-t0)/dur)), d=ease(u)*L;
    const a=path.getPointAtLength(d), b=path.getPointAtLength(Math.min(L,d+1)), c=path.getPointAtLength(Math.max(0,d-1));
    const ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI, flip=Math.abs(ang)>90;
    g.setAttribute("transform",`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${ang.toFixed(1)})${flip?" scale(1,-1)":""}`);
    if(u<1) requestAnimationFrame(step); else { g.style.opacity="0"; setTimeout(()=>g.remove(),550); }
  })(t0);
}
function mapSvg(trips){
  const W=GEO.W,H=GEO.H, m=S.map;
  const order=["EGY","SAU","CYP","TUR","IRQ","ISR","PSE","JOR","LBN"];
  let s=`<svg class="map-svg" viewBox="40 60 ${W-40} ${H-90}" role="img" aria-label="Map of routes"><rect x="0" y="0" width="${W}" height="${H}" fill="var(--sea)"/>`;
  s+=order.map(c=>GEO[c]?`<path class="c-other" d="${GEO[c]}"/>`:"").join("");
  s+=`<path class="c-syr" d="${GEO.SYR}"/>`;
  const cn=[["TURKEY","تركيا",37.25,36.0],["IRAQ","العراق",34.0,42.9],["JORDAN","الأردن",31.5,37.3],["LEBANON","لبنان",34.25,35.25],["SYRIA","سوريا",34.45,38.6]];
  s+=cn.map(([en,ar,la,lo])=>{const[x,y]=proj(la,lo);return `<text class="cname" x="${x}" y="${y}" text-anchor="middle">${lang==="ar"?ar:en}</text>`}).join("");
  // aggregate arcs
  const agg={};
  trips.forEach(tr=>{ if(!CITIES[tr.from]||!CITIES[tr.to]) return; const k=pairKey(tr.from,tr.to);
    const a=agg[k]||(agg[k]={n:0,seats:0,planned:0}); a.n++; if(isOpenForSeats(tr)) a.seats+=freeSeats(tr); if(effStatus(tr)==="planned") a.planned++; });
  const keys=Object.keys(agg).sort((a,b)=>agg[b].n-agg[a].n);
  const maxN=Math.max(1,...keys.map(k=>agg[k].n));
  let arcs="";
  keys.slice().reverse().forEach(k=>{
    const [a,b]=k.split("|"); const A=proj(CITIES[a].lat,CITIES[a].lon),B=proj(CITIES[b].lat,CITIES[b].lon);
    const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy)||1;
    const off=Math.min(60,len*0.18); const cx=mx-dy/len*off, cy=my+dx/len*off;
    const d=`M${A[0].toFixed(1)},${A[1].toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${B[0].toFixed(1)},${B[1].toFixed(1)}`;
    const g=agg[k]; const col=g.seats?"var(--arc-seat)":g.planned?"var(--arc-plan)":"var(--arc-done)";
    const w=(2+Math.sqrt(g.n/maxN)*9).toFixed(1);
    const dim = (m.route && m.route!==k) || (m.city && a!==m.city && b!==m.city);
    const tip=`${cityName(a)} ↔ ${cityName(b)}: ${g.n} ${t("trips")}${g.seats?` · ${g.seats} ${t("free")}`:""}`;
    arcs+=`<g data-route="${k}"><path class="arc${dim?" dim":""}" d="${d}" stroke="${col}" stroke-width="${w}" stroke-opacity=".85"/><path class="arc-hit" d="${d}"><title>${esc(tip)}</title></path></g>`;
  });
  s+=arcs;
  const used=new Set(); trips.forEach(tr=>{used.add(tr.from);used.add(tr.to);});
  Object.entries(CITIES).forEach(([c,o])=>{
    const [x,y]=proj(o.lat,o.lon); const left=o.lab==="l"; const r=o.hub?6:used.has(c)?5:3.5;
    const cnt=trips.filter(tr=>tr.from===c||tr.to===c).length;
    s+=`<g class="city${o.hub?" hub":""}${m.city===c?" sel":""}" data-city="${c}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/><text x="${(x+(left?-10:10)).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${left?"end":"start"}">${esc(o[lang])}</text>${cnt?`<text class="sub" x="${(x+(left?-10:10)).toFixed(1)}" y="${(y+17).toFixed(1)}" text-anchor="${left?"end":"start"}">${c} · ${cnt}</text>`:""}<title>${esc(o[lang])}</title></g>`;
  });
  return s+"</svg>";
}
function seatbar(tr){
  const used=(tr.pax||[]).length, fr=freeSeats(tr); if(used+fr>12) return `<span class="num small">${used}/${tr.seats}</span>`;
  return `<span class="seatbar" title="${used}/${tr.seats}">${"<i></i>".repeat(used)}${'<i class="free"></i>'.repeat(effStatus(tr)==="planned"?fr:0)}</span>`;

function regTrips(){
  const r=S.reg; const q=r.q.trim().toLowerCase();
  let arr=[...S.trips.values()];
  if(r.from) arr=arr.filter(x=>x.from===r.from); if(r.to) arr=arr.filter(x=>x.to===r.to);
  if(r.agency) arr=arr.filter(x=>x.lead===r.agency||(x.pax||[]).includes(r.agency));
  if(r.status) arr=arr.filter(x=>effStatus(x)===r.status);
  if(q) arr=arr.filter(x=>[x.lead,x.from,x.to,cityName(x.from),cityName(x.to),x.comments,x.cargo,(x.pax||[]).join(" "),x.date].join(" ").toLowerCase().includes(q));
  arr.sort((a,b)=> r.sort==="asc" ? (a.date+a.time).localeCompare(b.date+b.time) : (b.date+b.time).localeCompare(a.date+a.time));
  return arr;
}

const canManageTrip = tr => !!tr && (S.admin || tr.lead===S.myAgency);
const canEditAgency = code => S.admin || code===S.myAgency;
function incomingRequests(){ return [...S.requests.values()].filter(r=>{const tr=S.trips.get(r.tripId);return tr&&(S.admin||tr.lead===S.myAgency);}); }
function matchingTripsFor(n){
  return [...S.trips.values()].filter(tr=>tr.from===n.from&&tr.to===n.to&&isOpenForSeats(tr)&&Math.abs(dayDiff(tr.date,n.date))<=(+n.flex||0)&&tr.lead!==n.agency)
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function reqRow(r,mode){
  const tr=S.trips.get(r.tripId);
  const route=tr?`${esc(cityName(tr.from))} <span class="arrow">→</span> ${esc(cityName(tr.to))} · <span class="num">${esc(fmtDate(tr.date,{day:"numeric",month:"short"}))} ${esc(tr.time||"")}</span>`:"?";
  const acts = mode==="in" && r.status==="pending" ? `<button class="btn small primary" data-act="accept" data-id="${esc(r.id)}">${esc(t("accept"))}</button><button class="btn small" data-act="decline" data-id="${esc(r.id)}">${esc(t("decline"))}</button>`

function applyView(){

async function savePlace(code){
  const err=$("#f-err"), show=m=>{err.textContent=m;err.hidden=false;};
  const c=(code||$("#p-code").value).trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length<2) return show(t("placeCode"));
  if(!code && (CITIES[c]||BASE_CITIES[c])) return show(t("codeTaken"));
  const en=$("#p-en").value.trim(), ar=$("#p-ar").value.trim(), lat=parseFloat($("#p-lat").value), lon=parseFloat($("#p-lon").value);
  if(!en) return show(t("needName"));
  if(isNaN(lat)||isNaN(lon)||lat<28||lat>40||lon<32||lon>46) return show(t("badCoords"));
  const d={en,ar:ar||en,lat:+lat.toFixed(4),lon:+lon.toFixed(4)}; const lab=$("#p-lab").value, cc=$("#p-cc").value;
  if(lab) d.lab=lab; if(cc) d.cc=cc; if($("#p-hub").checked) d.hub=1;
  const base=BASE_CITIES[c]; const next={...(S.places||{})};
  next[c]= base ? {...d, lab:lab||"", cc:cc||"", hub:d.hub||0} : d;
  try{ await savePlaces(next); closeOverlay(); toast(t("saved")); }catch(e){ show(writeErr(e)); }
}

function renderDash(){
  const p=S.dash.period; let arr=[...S.trips.values()];
  const yrs=[...new Set(arr.map(x=>x.date.slice(0,4)))].sort();
  if(p==="last90") arr=arr.filter(x=>x.date>=addDays(TODAY,-90)&&x.date<=TODAY);
  else if(/^\d{4}$/.test(p)) arr=arr.filter(x=>x.date.startsWith(p));
  const done=arr.filter(x=>x.status==="completed");
  const paxDone=done.reduce((s,x)=>s+(x.pax||[]).length,0), seatsDone=done.reduce((s,x)=>s+(+x.seats||0),0);
  const shared=done.filter(x=>(x.pax||[]).some(a=>a!==x.lead));
  const canc=arr.filter(x=>x.status==="cancelled").length;
  const groups={}; arr.filter(x=>x.status!=="cancelled").forEach(x=>{const k=x.date+x.from+x.to;(groups[k]=groups[k]||new Set()).add(x.lead);});
  const missed=Object.values(groups).filter(s=>s.size>1).length;
  const cost=arr.reduce((s,x)=>s+(+x.cost||0),0);
  const overdue=arr.filter(x=>effStatus(x)==="overdue").length;
  // months
  const months={}; arr.forEach(x=>{const k=x.date.slice(0,7);const o=months[k]||(months[k]={c:0,p:0,x:0});const s=effStatus(x);if(s==="completed")o.c++;else if(s==="cancelled")o.x++;else o.p++;});
  const mk=Object.keys(months).sort(); const mMax=Math.max(1,...mk.map(k=>months[k].c+months[k].p+months[k].x));
  const routes={}; arr.filter(x=>x.status!=="cancelled").forEach(x=>{const k=pairKey(x.from,x.to);routes[k]=(routes[k]||0)+1;});
  const rk=Object.entries(routes).sort((a,b)=>b[1]-a[1]).slice(0,8); const rMax=Math.max(1,...rk.map(r=>r[1]));
  const ags={}; arr.filter(x=>x.status!=="cancelled").forEach(x=>{const k=x.lead||"?";ags[k]=(ags[k]||0)+1;});
  const ak=Object.entries(ags).sort((a,b)=>b[1]-a[1]); const aMax=Math.max(1,...ak.map(r=>r[1]));
  const per=["all",...yrs,"last90"];
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":t("none");
  $("#view").innerHTML=`
  <div class="chips" style="margin-bottom:14px">${per.map(x=>`<button class="chip" data-period="${x}" aria-pressed="${p===x}">${esc(x==="all"?t("all"):x==="last90"?t("last90"):x)}</button>`).join("")}</div>
  <div class="kpis">
    <div class="panel kpi"><div class="v num">${done.length}</div><div class="l">${esc(t("kTrips"))}</div></div>
    <div class="panel kpi"><div class="v num">${done.length?(paxDone/done.length).toFixed(1):t("none")}</div><div class="l">${esc(t("kAvg"))}</div></div>
    <div class="panel kpi"><div class="v num">${pct(paxDone,seatsDone)}</div><div class="l">${esc(t("kFill"))}<br><span class="small">${esc(t("fillNote"))}</span></div></div>
    <div class="panel kpi alertk"><div class="v num">${shared.length} <span style="font-size:14px">/ ${done.length}</span></div><div class="l">${esc(t("kShared"))}</div></div>
    <div class="panel kpi alertk"><div class="v num">${missed}</div><div class="l">${esc(t("kMissed"))}<br><span class="small">${esc(t("kMissedSub"))}</span></div></div>
    <div class="panel kpi"><div class="v num">${pct(canc,arr.length)}</div><div class="l">${esc(t("kCancel"))} · <span class="num">${canc}</span></div></div>
    <div class="panel kpi"><div class="v num">${money(cost)}</div><div class="l">${esc(t("kCost"))}</div></div>
    <div class="panel kpi"><div class="v num" style="color:var(--warn)">${overdue}</div><div class="l">${esc(t("kOverdue"))}</div></div>
  </div>
  <div class="cols">

      <div class="months">${mk.map(k=>{const o=months[k];return `<div class="mcol" title="${esc(fmtDate(k+"-15",{month:"long",year:"numeric"}))}: ${o.c+o.p+o.x}"><div class="seg c" style="height:${o.c/mMax*100}%"></div><div class="seg p" style="height:${o.p/mMax*100}%"></div><div class="seg x" style="height:${o.x/mMax*100}%"></div></div>`}).join("")}</div>

async function saveTrip(id){
  const g=s=>$(s)?.value??"";

  const data={date:g("#f-date"),time:g("#f-time"),from:g("#f-from"),to:g("#f-to"),lead:g("#f-lead"),vehicle:g("#f-vehicle"),seats:Math.max(1,+g("#f-seats")||4),
    pax:readPax(),cargo:(id&&S.trips.get(id)?.cargo)||"",cost:g("#f-cost")===""?null:+g("#f-cost"),reimb:g("#f-reimb"),comments:g("#f-comments").trim()};
  if(!data.date||!data.from||!data.to) return show(t("required"));
  if(data.from===data.to) return show(t("sameCity"));
  if(!S.admin){ data.lead=S.myAgency; if(id&&!canManageTrip(S.trips.get(id))) return show(t("onlyLead")); }
  if(!data.lead) return show(t("chooseAgency"));
  if(data.pax.length>data.seats) data.seats=data.pax.length;

    if(id){ data.status=g("#f-status"); await db.doc("trips/"+id).update(data); }
    else{
      data.status="planned"; data.by=S.user; data.at=new Date().toISOString();
      await db.collection("trips").add(data);
    }
    closeOverlay(); toast(t("saved"));
  }catch(e){ show(writeErr(e)); }
}

function onRouteStops(from,to){
  const A=CITIES[from],B=CITIES[to]; if(!A||!B) return [];
  const [ax,ay]=proj(A.lat,A.lon),[bx,by]=proj(B.lat,B.lon), dx=bx-ax,dy=by-ay, L2=dx*dx+dy*dy||1, L=Math.sqrt(L2);
  return Object.entries(CITIES).filter(([c])=>c!==from&&c!==to).map(([c,o])=>{const[x,y]=proj(o.lat,o.lon);const u=((x-ax)*dx+(y-ay)*dy)/L2;const d=Math.abs((x-ax)*dy-(y-ay)*dx)/L;return {c,u,d};})
    .filter(p=>p.u>0.04&&p.u<0.96&&p.d<Math.max(35,L*0.16)).sort((a,b)=>a.u-b.u).map(p=>p.c);
}

async function sendRequest(id){
  const ag=$("#r-ag").value, n=Math.max(1,+$("#r-n").value||1), err=$("#f-err");
  if(!ag){err.textContent=t("pickAgencyFirst");err.hidden=false;return;}
  const tr=S.trips.get(id); if(tr && n>freeSeats(tr)){err.textContent=t("notEnough");err.hidden=false;return;}
  try{ await db.collection("requests").add({tripId:id,agency:ag,seats:n,dropoff:$("#r-drop").value||"",names:$("#r-names").value.trim(),note:$("#r-note").value.trim(),status:"pending",by:S.user,at:new Date().toISOString()});
    closeOverlay(); toast(t("sent")); }catch(e){err.textContent=writeErr(e);err.hidden=false;}
}
async function decide(rid,accept){
  const r=S.requests.get(rid); if(!r) return; if(!canManageTrip(S.trips.get(r.tripId))){ toast(t("onlyLead")); return; } const ref=db.doc("trips/"+r.tripId);
  try{
    if(accept){
      const snap=await ref.get(); if(!snap.exists) return;
      const tr=snap.data(); const free=Math.max(0,(+tr.seats||0)-(tr.pax||[]).length);
      if(free<r.seats){ toast(t("notEnough")); return; }
      const upd={pax:[...(tr.pax||[]),...Array(r.seats).fill(r.agency)]};
      if(r.dropoff&&r.dropoff!==tr.to) upd.drops=[...(tr.drops||[]),{agency:r.agency,seats:r.seats,at:r.dropoff}];
      await ref.update(upd);
    }
    await db.doc("requests/"+rid).update({status:accept?"accepted":"declined",decidedBy:S.user,decidedAt:new Date().toISOString()});
    toast(t("saved"));
  }catch(e){ toast(writeErr(e)); }
}

async function saveAgency(code){
  const c=(code||$("#a-code").value).trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""); const err=$("#f-err");
  if(!canEditAgency(c)){err.textContent=t("ownOnly");err.hidden=false;return;}

  const contacts=[...document.querySelectorAll(".ct-row")].map(r=>({kind:r.querySelector(".c-kind").value,name:r.querySelector(".c-name").value.trim(),role:r.querySelector(".c-role").value.trim(),email:r.querySelector(".c-email").value.trim(),phone:r.querySelector(".c-phone").value.trim()})).filter(x=>x.name||x.email||x.phone);
  const d={code:c,name:$("#a-name").value.trim(),areas:[...document.querySelectorAll(".a-area:checked")].map(x=>x.value),contacts,notes:$("#a-notes").value.trim()};
  const prevEm=S.agencies.get(c)?.emails||[];
  d.emails = S.admin ? [...new Set(($("#a-emails")?.value||"").split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))] : prevEm;
  try{
    await db.doc("agencies/"+c).set(d);
    if(S.admin){ for(const e of prevEm) if(!d.emails.includes(e)) await db.doc("users/"+e).delete(); for(const e of d.emails) await db.doc("users/"+e).set({agency:c}); }
    closeOverlay(); toast(t("saved"));
  }catch(e){err.textContent=writeErr(e);err.hidden=false;}
}

/* ---------- export ---------- */
function loadXLSX(){ return new Promise((res,rej)=>{ if(window.XLSX) return res(window.XLSX); const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=()=>res(window.XLSX); s.onerror=rej; document.head.appendChild(s); }); }
async function exportXlsx(){
  try{
    const X=await loadXLSX();
    const head=["Date","From","To","Departure time","Lead Agency"].concat(Array.from({length:10},(_,i)=>"Passenger #"+(i+1))).concat(["Small Cargo","Vehicle","Seats","Free seats","Cost of the whole trip (USD)","Reimbursement Status","Comments","Status"]);
    const rows=regTrips().slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>{const p=(x.pax||[]).slice(0,10);while(p.length<10)p.push("");
      return [x.date,x.from,x.to,x.time||"",x.lead].concat(p).concat([x.cargo||"",x.vehicle?I18N.en[x.vehicle]:"",+x.seats||"",freeSeats(x),x.cost??"",x.reimb==="paid"?"Paid":x.reimb?"Pending":"",x.comments||"",I18N.en[effStatus(x)]]);});
    const ws=X.utils.aoa_to_sheet([head,...rows]); ws["!cols"]=head.map((h,i)=>({wch:i===0?11:i>=20?18:10}));
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,"All Routes");
    const buf=X.write(wb,{type:"array",bookType:"xlsx"});
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a"); a.href=url; a.download="Movement_Planning_"+TODAY+".xlsx"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ if(e&&e.code==="declined") return; toast(t("exportFail")); }
}

document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act],[data-tab],[data-trip],[data-range],[data-period],[data-city],[data-route],[data-copy]");
  if(!el) return;
  if(el.dataset.copy!==undefined){ ev.stopPropagation(); const v=el.dataset.copy; try{ await navigator.clipboard.writeText(v); el.textContent=t("copied"); setTimeout(()=>el.textContent=t("copy"),1400);}catch(e){ toast(v); } return; }
  if(el.dataset.tab){ S.tab=el.dataset.tab; try{history.replaceState(null,"","#"+S.tab);}catch(e){} render(); return; }
  if(el.dataset.range){ S.map.range=el.dataset.range; S.map.limit=120; render(); return; }
  if(el.dataset.period){ S.dash.period=el.dataset.period; render(); return; }
  if(el.dataset.city){ S.map.city=S.map.city===el.dataset.city?"":el.dataset.city; S.map.route=""; render(); if(S.map.city&&isNarrow()) scrollToList(); return; }
  if(el.dataset.route){ S.map.route=S.map.route===el.dataset.route?"":el.dataset.route; S.map.city=""; render(); if(S.map.route&&isNarrow()) scrollToList(); return; }
  const act=el.dataset.act;
  if(!act && el.dataset.trip){ tripDetail(el.dataset.trip); return; }
  switch(act){
    case "overlay-bg": if(ev.target===el) closeOverlay(); break;
    case "close": closeOverlay(); break;
    case "logout": logout(); break;
    case "new-trip": tripForm(); break;
    case "need": needForm(); break;
    case "clear-map": S.map.city="";S.map.route=""; render(); break;
    case "more-map": S.map.limit+=200; render(); break;
    case "more-reg": S.reg.limit+=300; render(); break;
    case "sort": S.reg.sort=S.reg.sort==="asc"?"desc":"asc"; render(); break;
    case "show-overdue": S.reg.status=S.reg.status==="overdue"?"":"overdue"; render(); break;
    case "export": exportXlsx(); break;
    case "add-pax": $("#pax-rows").insertAdjacentHTML("beforeend",paxRowHtml("",1)); updateTripFormHelpers(); break;
    case "rm-pax": el.closest(".paxrow").remove(); updateTripFormHelpers(); break;
    case "use-rate": $("#f-cost").value=el.dataset.v; break;
    case "save-trip": el.disabled=true; await saveTrip(el.dataset.id); el.disabled=false; break;
    case "edit-trip": tripForm(el.dataset.id); break;
    case "set-status": try{ await db.doc("trips/"+el.dataset.id).update({status:el.dataset.s}); toast(t("saved")); tripDetail(el.dataset.id);}catch(e){toast(writeErr(e));} break;
    case "req-seat": seatRequestForm(el.dataset.id); break;
    case "send-req": el.disabled=true; await sendRequest(el.dataset.id); el.disabled=false; break;
    case "accept": el.disabled=true; await decide(el.dataset.id,true); break;
    case "decline": el.disabled=true; await decide(el.dataset.id,false); break;
    case "withdraw-req": try{ await db.doc("requests/"+el.dataset.id).update({status:"withdrawn"}); }catch(e){toast(writeErr(e));} break;
    case "save-need": el.disabled=true; await saveNeed(); el.disabled=false; break;
    case "need-covered": case "need-withdraw": try{ await db.doc("needs/"+el.dataset.id).update({status:act==="need-covered"?"covered":"withdrawn"}); }catch(e){toast(writeErr(e));} break;
    case "new-agency": agencyForm(); break;
    case "edit-agency": agencyForm(el.dataset.id); break;
    case "add-contact": $("#ct-rows").insertAdjacentHTML("beforeend",contactRowHtml({kind:"focal"})); break;
    case "rm-contact": el.closest(".ct-row").remove(); break;
    case "save-agency": el.disabled=true; await saveAgency(el.dataset.id); el.disabled=false; break;
    case "new-place": placeForm(); break;
    case "notify": S.notifyOpen=!S.notifyOpen; if(S.notifyOpen) renderNotify(); else closeNotify(); break;
    case "n-close": closeNotify(); break;
    case "n-trip": tripDetail(el.dataset.id); break;
    case "n-reqseat": seatRequestForm(el.dataset.id); break;
    case "n-status": el.disabled=true; try{ await db.doc("trips/"+el.dataset.id).update({status:el.dataset.s}); toast(t("saved")); }catch(e){toast(writeErr(e));} break;
    case "edit-place": placeForm(el.dataset.id); break;
    case "save-place": el.disabled=true; await savePlace(el.dataset.id); el.disabled=false; break;
    case "del-place": { if(!(await confirmFirst(el))) break; const c=el.dataset.id, next={...(S.places||{})}; if(BASE_CITIES[c]) next[c]={...(next[c]||{}),hidden:true}; else delete next[c]; try{ await savePlaces(next); toast(t("saved")); }catch(e){toast(writeErr(e));} break; }
    case "restore-place": { const c=el.dataset.id, next={...(S.places||{})}; if(next[c]){ const {hidden,...rest}=next[c]; if(Object.keys(rest).length) next[c]=rest; else delete next[c]; } try{ await savePlaces(next); }catch(e){toast(writeErr(e));} break; }
    case "del-agency": { if(!S.admin) break; const c=el.dataset.id; if(!(await confirmFirst(el))) break; try{ for(const e of (S.agencies.get(c)?.emails||[])) await db.doc("users/"+e).delete(); await db.doc("agencies/"+c).delete(); toast(t("saved")); }catch(e){toast(writeErr(e));} break; }
    default: if(el.dataset.trip) tripDetail(el.dataset.trip);
  }
});

});

    <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="l-email">${esc(t("emailLbl"))}</label><input id="l-email" type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" value="${esc(em)}" required></div>
      <div class="field"><label for="l-pass">${esc(t("password"))}</label><input type="password" id="l-pass" autocomplete="current-password" dir="ltr" required></div>
      ${loginMsg?`<div class="alert ${loginMsg.ok?"seat":"warn"}">${esc(loginMsg.text||loginMsg)}</div>`:""}
      <button class="btn primary" type="submit" style="justify-content:center"${loginBusy?" disabled":""}>${esc(loginBusy?t("signingIn"):t("signIn"))}</button>
      <button class="btn ghost small" type="button" data-act="forgot" style="align-self:center">${esc(t("forgot"))}</button>
    </form>`);
}
function authErr(e){
  const c=(e&&e.code)||"";
  if(/too-many-requests/.test(c)) return t("tooMany");
  if(/network/.test(c)) return t("netErr");
  return t("badLogin");
}
function showApp(){ $("#login").hidden = true; $("#app").hidden = false; renderActing(); render(); }
function showLogin(err){ closeOverlay(); $("#app").hidden = true; $("#login").hidden = false; renderLogin(err); }
async function doLogin(email,pw){
  loginBusy=true; renderLogin(null);
  try{ await auth.signInWithEmailAndPassword(normEmail(email),pw); }
  catch(e){ loginBusy=false; showLogin(authErr(e)); }
}
async function forgotPw(){
  const em=normEmail($("#l-email")?.value); if(!em){ renderLogin(t("needEmail")); return; }
  try{ await auth.sendPasswordResetEmail(em); }catch(e){}
  renderLogin({ok:true,text:t("resetSent")});
}
function logout(){ S.notifyOpen=false; S.notifiedFor=null; renderNotify(); if(auth) auth.signOut(); }
function stopData(){ unsubs.forEach(f=>{ try{f();}catch(e){} }); unsubs=[]; [S.trips,S.requests,S.needs,S.agencies].forEach(m=>m.clear()); }
async function onUser(u){
  stopData(); loginBusy=false;
  if(!u){ S.user=null; S.email=null; S.admin=false; S.myAgency=""; showLogin(null); return; }
  const email=(u.email||"").toLowerCase();
  S.admin = email===ADMIN_EMAIL.toLowerCase();
  let agency="";
  if(!S.admin){
    try{ const d=await db.doc("users/"+email).get(); agency=d.exists?(d.data().agency||""):""; }catch(e){ console.error(e); }
    if(!agency){ await auth.signOut(); showLogin(t("noAgencyLink")); return; }
  }
  S.email=email; S.user = S.admin ? "admin" : agency; S.myAgency=agency; S.ready=false; S.dbOk=true;
  showApp(); subscribe();
}
function subscribe(){
  const pending=new Set(["trips","requests","needs","agencies"]);
  const done=n=>{ if(pending.delete(n) && !pending.size){ S.ready=true; maybeNotify(); } schedule(); };
  const onErr=e=>{ console.error(e); S.dbOk=false; S.ready=true; schedule(); };
  const sub=(name,map,fix)=>unsubs.push(db.collection(name).onSnapshot(snap=>{ map.clear(); snap.docs.forEach(d=>{ const x={id:d.id,...d.data()}; map.set(d.id, fix?fix(x):x); }); done(name); }, onErr));
  sub("trips",S.trips); sub("requests",S.requests); sub("needs",S.needs); sub("agencies",S.agencies,x=>({...x,code:x.code||x.id}));
  unsubs.push(db.doc("meta/places").onSnapshot(s=>{ S.places=(s.exists&&s.data().places)||{}; applyPlaces(S.places); schedule(); }, e=>console.error(e)));
  unsubs.push(db.doc("meta/directory").onSnapshot(s=>{ S.prospects=(s.exists&&s.data().prospects)||[]; schedule(); }, e=>console.error(e)));
}
document.addEventListener("submit", ev => { if(ev.target.id === "login-form"){ ev.preventDefault(); doLogin($("#l-email").value, $("#l-pass").value); } });
document.addEventListener("click", ev => { if(ev.target.closest('[data-act="forgot"]')) forgotPw(); });
document.addEventListener("click", ev => { const b = ev.target.closest('[data-act="set-lang"]'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem("mp-lang", lang); }catch(e){} applyLang(); if(S.user){ renderActing(); render(); } else renderLogin(); });

document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-mview]"); if(!b) return; S.mapView=b.dataset.mview; render(); });
const BP_SEL=".panel,.btn.primary:not(.small),.brand-mark";
function decorate(){ document.querySelectorAll(BP_SEL).forEach(el=>{ if(el.classList.contains("blueprint")) return; el.classList.add("blueprint"); el.insertAdjacentHTML("beforeend",'<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'); }); }
new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
/* =====================================================================
   BOOT
   ===================================================================== */
applyLang();
let rerenderQ = null;
function schedule(){
  if(rerenderQ) return;
  rerenderQ = requestAnimationFrame(() => {
    rerenderQ = null;
    if(!S.user){ if(!$("#login").hidden) renderLogin(); return; }
    renderActing();
    if(!document.activeElement || !document.activeElement.matches("#reg-q")) render(); else renderTabs();
    if(overlayState?.kind === "detail") tripDetail(overlayState.id);
    if(overlayState?.kind === "trip-form") updateTripFormHelpers();
  });
}
(async function boot(){
  $("#login").hidden=false; $("#login").innerHTML=loginShell(`<p class="lede">${esc(t("loading"))}</p>`);
  if(!FIREBASE_CONFIG){ renderLogin(); return; }
  try{ auth=await initFirebase(); }catch(e){ console.error(e); renderLogin(t("netErr")); return; }
  auth.onAuthStateChanged(onUser);
})();
})();
</script>

</body>
</html>
